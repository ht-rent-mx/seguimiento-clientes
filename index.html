function comprimir(file,maxPx,q){maxPx=maxPx||1600;q=q||0.72;return new Promise((res,rej)=>{
  if(!/^image\//.test(file.type)){const fr=new FileReader();fr.onload=()=>res({b64:String(fr.result).split(",")[1],mime:file.type||"application/octet-stream",nombre:file.name||"archivo"});fr.onerror=rej;fr.readAsDataURL(file);return;}
  const fr=new FileReader();fr.onload=()=>{const img=new Image();img.onload=()=>{
    let w=img.width,h=img.height;const s=Math.min(1,maxPx/Math.max(w,h));w=Math.round(w*s);h=Math.round(h*s);
    const c=document.createElement("canvas");c.width=w;c.height=h;c.getContext("2d").drawImage(img,0,0,w,h);
    const d=c.toDataURL("image/jpeg",q);
    res({b64:d.split(",")[1],mime:"image/jpeg",nombre:String(file.name||"escaneo").replace(/\.[^.]+$/,"")+".jpg"});
  };img.onerror=rej;img.src=String(fr.result);};fr.onerror=rej;fr.readAsDataURL(file);});}

const DIAS=["domingo","lunes","martes","miércoles","jueves","viernes","sábado"];
const MESES=["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];
const pad=n=>String(n).padStart(2,"0");
const parse=s=>{const[y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d);};
const toISO=dt=>`${dt.getFullYear()}-${pad(dt.getMonth()+1)}-${pad(dt.getDate())}`;
const addDays=(s,n)=>{const dt=parse(s);dt.setDate(dt.getDate()+n);return toISO(dt);};
const largo=s=>{const dt=parse(s);return `${DIAS[dt.getDay()]} ${dt.getDate()} de ${MESES[dt.getMonth()]}`;};
const corto=s=>{if(!s)return"";const dt=parse(s);return `${dt.getDate()} ${MESES[dt.getMonth()].slice(0,3)}`;};
const hora=s=>{if(!s)return"";const dt=new Date(s);return `${pad(dt.getHours())}:${pad(dt.getMinutes())}`;};
const fechaHora=s=>{if(!s)return"";const dt=new Date(s);return `${dt.getDate()} ${MESES[dt.getMonth()].slice(0,3)} · ${pad(dt.getHours())}:${pad(dt.getMinutes())}`;};
const HOY=toISO(new Date());
function estadoCompromiso(r,now){if(!r.compromiso||r.compromisoCumplido)return null;const d=new Date(r.compromiso).getTime()-now;if(d<0)return"vencido";if(d<=3600000)return"proximo";return"programado";}

function Puerta({onEntrar}){
  const [v,setV]=useState("");const [correo,setCorreo]=useState("");const [err,setErr]=useState("");const [verif,setVerif]=useState(false);
  const inpP="w-full rounded-lg border border-stone-300 bg-white px-3 py-2 text-sm outline-none focus:border-carbon focus:ring-2 focus:ring-forza-suave";
  const probar=async()=>{const p=v.trim();const c=(correo||"").trim();if(!p||verif)return;setVerif(true);setErr("");
    try{
      if(c){ // usuario individual
        const ses=await apiSesion(c,p);
        if(!ses){setErr("Ese correo y contraseña no coinciden.");return;}
        USR={correo:ses.correo,pass:p,nombre:ses.nombre,nivel:ses.nivel,empresas:ses.empresas||[],categorias:ses.categorias||[]};
        SESION_PASS="";
        onEntrar(USR.nivel==="sc"||USR.nivel==="admin"?"edit":"incidencias");return;
      }
      const nivel=await apiLogin(p);
      if(nivel==="edit"||nivel==="ver"){USR=null;SESION_PASS=p;onEntrar(nivel);return;}
      if(nivel==="calidad_edit"||nivel==="calidad_ver"){setErr("El tablero de incidencias se abre con tu correo y tu contraseña personal. Escribe tu correo arriba.");return;}
      setErr("Contraseña incorrecta.");
    }catch(e){setErr("No se pudo conectar con el servidor: "+e.message);}
    finally{setVerif(false);}};
  return (<div className="grid min-h-screen place-items-center bg-carbon px-5">
    <div className="w-full max-w-sm overflow-hidden rounded-lg border-2 border-carbon-edge bg-white shadow-xl">
      <div className="border-b-[5px] border-forza bg-carbon px-6 py-5">
        <div className="marca-jj" style={{display:"block"}}><b>JJ FORZA</b><span>SEMI-REMOLQUES</span></div>
      </div>
      <div className="p-6">
        <div className="mb-4"><h1 className="font-display text-2xl leading-tight text-carbon">Seguimiento a Clientes</h1><p className="text-sm text-slate-500 mt-1">Servicio a Clientes</p></div>
        <p className="mb-3 text-sm text-slate-500">Entra con tu correo y tu contraseña. Si usas la contraseña del área, deja el correo vacío.</p>
        <label className="mb-1 block text-xs font-semibold text-slate-600">Correo</label>
        <input type="email" value={correo} autoFocus autoComplete="username" onChange={e=>{setCorreo(e.target.value);setErr("");}} onKeyDown={e=>{if(e.key==="Enter")probar();}} className={inpP} placeholder="Tu correo de trabajo"/>
        <label className="mt-3 mb-1 block text-xs font-semibold text-slate-600">Contraseña</label>
        <input type="password" value={v} autoComplete="current-password" onChange={e=>{setV(e.target.value);setErr("");}} onKeyDown={e=>{if(e.key==="Enter")probar();}} className={inpP} placeholder="Contraseña"/>
        {err && <p className="mt-2 text-xs font-semibold text-red-600">{err}</p>}
        <button onClick={probar} disabled={verif} className="mt-3 w-full rounded-lg border border-forza bg-forza px-4 py-2.5 text-sm font-bold text-forza-tinta hover:brightness-95 disabled:opacity-60">{verif?"Verificando…":"Entrar"}</button>
        <p className="mt-3 text-[11px] leading-relaxed text-slate-400">Con la contraseña de consulta puedes ver toda la información. Para capturar o modificar necesitas la contraseña de edición.</p>
      </div>
    </div>
  </div>);
}

  const STOP=new Set(["de","del","la","el","los","las","con","en","y","o","que","me","muestra","muestrame","dame","quiero","ver","todos","todas","clientes","cliente","por","para","un","una","estatus","etapa","los"]);
  const setExacto=(lista,label,key)=>{let mejor=null;(lista||[]).forEach(op=>{const n=_norm(op);if(!n)return;const re=new RegExp("(^| )"+n.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+"( |$)");if(re.test(t)){if(!mejor||n.length>_norm(mejor).length)mejor=op;}});if(mejor){res[key]=mejor;hits.push(label+": "+mejor);}return mejor;};
  setExacto(ctx.ejecutivos,"Ejecutivo","ejec");
  setExacto(ctx.estatus,"Etapa","estatus");
  if(!res.estatus){
    if(/ entregad/.test(t)){res.estatus="Entregado";hits.push("Etapa: Entregado");}
    else if(/ cancelad/.test(t)){res.estatus="Cancelado";hits.push("Etapa: Cancelado");}
  }
  // palabras restantes -> búsqueda por texto (nombre de cliente, NIV, folio, equipo, empresa, contrato)
  const usados=_norm([res.ejec,res.estatus].filter(Boolean).join(" ")).split(" ");
  const palabras=_norm(texto).split(" ").filter(w=>w.length>=3&&!STOP.has(w)&&usados.indexOf(w)<0);
  if(palabras.length){res.busca=[...new Set(palabras)];hits.push("Texto: "+res.busca.join(" "));}
  return {res,hits};
}

function uniEq(r){return (r.equipos||[]).reduce((s,e)=>s+(e.tipo?(Number(e.cantidad)||1):0),0);}
function entregadosCli(r){if(r.entregaModo==="completa")return uniEq(r);if(r.entregaModo==="parcial")return (r.nivsEntrega||[]).filter(e=>e.entregado).length;return 0;}
function faltanCli(r){return Math.max(0,uniEq(r)-entregadosCli(r));}
function esParcial(r){return r.entregaModo==="parcial";}
function esDevuelto(r){return !!r.devueltoComercial;}
function entregaCompletaCli(r){if(r.entregaModo==="completa")return true;if(r.entregaModo==="parcial")return uniEq(r)>0&&faltanCli(r)===0;return (r.estatuses||[]).includes("Entregado");}
function esCanceladoCli(r){return (r.estatuses||[]).includes("Cancelado");}
function seccDe(r){if(esCanceladoCli(r))return "cancelados";if(entregaCompletaCli(r))return "entregados";if(esDevuelto(r))return "devueltos";return "activos";}
function equiposEntregados(r){if(r.entregaModo==="parcial"||r.entregaModo==="completa")return entregadosCli(r);return (r.estatuses||[]).includes("Entregado")?uniEq(r):0;}

          <button onClick={()=>{setFEstatus(fEstatus==="Cancelado"?"":"Cancelado");setVista("clientes");}} className={`rounded-xl border bg-white px-4 py-3 text-left transition-all ${fEstatus==="Cancelado"?"border-rose-400 ring-2 ring-rose-200":"border-stone-200 hover:bg-stone-50"}`}><div className="flex items-center gap-1.5 text-slate-400"><Icon name="x" size={16}/><span className="text-xs font-medium text-slate-500">{fEjec==="Todos"?"Cancelados":"Cancelados · "+fEjec}</span></div><p className="mt-1 text-2xl font-bold mono text-rose-600 leading-none">{cancelEquipos}<span className="text-xs font-medium text-slate-400"> equipos</span></p><p className="text-[11px] text-slate-400 mt-0.5">{cancelClientes} cliente(s)</p></button>
          <Kpi icon="truck" label={fEjec==="Todos"?"Pendientes por entregar":"Pend. entregar · "+fEjec} valor={pendEntregar} tono="text-orange-600"/>
          <button onClick={()=>setFParcial(v=>!v)} className={`rounded-xl border bg-white px-4 py-3 text-left transition-all ${fParcial?"border-amber-400 ring-2 ring-amber-200":"border-stone-200 hover:bg-stone-50"}`}><div className="flex items-center gap-1.5 text-slate-400"><Icon name="truck" size={16}/><span className="text-xs font-medium text-slate-500">{fEjec==="Todos"?"Entrega parcial":"Parcial · "+fEjec}</span></div><p className="mt-1 text-2xl font-bold mono text-amber-600 leading-none">{parcialClientes}<span className="text-xs font-medium text-slate-400"> cliente(s)</span></p><p className="text-[11px] text-slate-400 mt-0.5">{parcialEntregados} entregados · {parcialFaltan} por entregar</p></button>
          <button onClick={()=>setFDevuelto(v=>!v)} className={`rounded-xl border bg-white px-4 py-3 text-left transition-all ${fDevuelto?"border-purple-400 ring-2 ring-purple-200":"border-stone-200 hover:bg-stone-50"}`}><div className="flex items-center gap-1.5 text-slate-400"><Icon name="left" size={16}/><span className="text-xs font-medium text-slate-500">{fEjec==="Todos"?"Devuelto a comercial":"Devuelto · "+fEjec}</span></div><p className="mt-1 text-2xl font-bold mono text-purple-600 leading-none">{devueltoClientes}<span className="text-xs font-medium text-slate-400"> cliente(s)</span></p><p className="text-[11px] text-slate-400 mt-0.5">{devueltoEquipos} equipo(s)</p></button>
          <Kpi icon="alarm" label="Llamadas por hacer" valor={porMarcar} tono={hayVencidas?"text-red-600":"text-slate-900"}/>
          <Kpi icon="clip" label="Expedientes por completar" valor={expIncompletos} tono="text-indigo-600"/>
          <Kpi icon="calendar" label="Entregas próx. 7 días" valor={entregas7} tono="text-emerald-600"/>
        </div>
        <TableroEtapas counts={etapaCounts} total={porEjec.length} activo={fEstatus} onPick={est=>{setFEstatus(fEstatus===est?"":est);setVista("clientes");}}/>

        <div className="flex items-center justify-between gap-3 flex-wrap mb-4">
          <div className="flex flex-wrap gap-1 border-b-[3px] border-carbon"><Tab activo={vista==="clientes"} onClick={()=>setVista("clientes")}>Clientes</Tab><Tab activo={vista==="tablero"} onClick={()=>setVista("tablero")}>Tablero</Tab><Tab activo={vista==="lista"} onClick={()=>setVista("lista")}>Lista</Tab><Tab activo={vista==="dia"} onClick={()=>setVista("dia")}>Día</Tab>{USR && <Tab activo={vista==="incidencias"} onClick={()=>setVista("incidencias")}>Incidencias</Tab>}</div>
          <div className="flex items-center gap-2 flex-wrap">
            <div className="flex items-center gap-1.5 rounded-lg border border-stone-300 bg-white px-2.5"><Icon name="search" size={14} className="text-slate-400"/><input value={busca} onChange={e=>setBusca(e.target.value)} placeholder="Buscar cliente, NIV, folio, tel…" className="py-1.5 text-sm outline-none w-48"/></div>
            <Select value={fEjec} onChange={cambiarEjec} options={["Todos",...ejecutivos]} prefijo="Ejecutivo"/>
            <Select value={fCli} onChange={setFCli} options={clientesOpc} prefijo="Cliente"/>
            <Select value={orden} onChange={setOrden} options={["Predeterminado","Más días en proceso","Menos días en proceso"]} prefijo="Orden"/>
          </div>
        </div>

        {fEstatus && <div className="mb-3"><span className="inline-flex items-center gap-2 rounded-lg bg-slate-100 px-3 py-1.5 text-xs font-semibold text-slate-700">Etapa: {fEstatus} <button onClick={()=>setFEstatus("")} className="text-slate-500 hover:text-red-500"><Icon name="x" size={13}/></button></span></div>}
        {vista==="clientes" && (()=>{
          const cActivos=mostrados.filter(r=>seccDe(r)==="activos").length;
          const cEntreg=mostrados.filter(r=>seccDe(r)==="entregados").length;
          const cCancel=mostrados.filter(r=>seccDe(r)==="cancelados").length;
          const cDevu=mostrados.filter(r=>seccDe(r)==="devueltos").length;
          const sub=[["activos","En seguimiento",cActivos,"text-slate-700"],["entregados","Entregados",cEntreg,"text-teal-700"],["devueltos","Devueltos",cDevu,"text-purple-700"],["cancelados","Cancelados",cCancel,"text-rose-700"]];
          const lista=mostrados.filter(r=>seccDe(r)===subLista);
          return (<div>
            <div className="mb-3 inline-flex rounded-xl border border-stone-300 bg-white p-0.5">{sub.map(([k,l,n,col])=>(<button key={k} onClick={()=>setSubLista(k)} className={`rounded-lg px-3 py-1.5 text-xs font-semibold transition-all ${subLista===k?"bg-stone-800 text-white":`${col} hover:bg-stone-100`}`}>{l} <span className={`ml-0.5 ${subLista===k?"text-white/70":"text-slate-400"}`}>({n})</span></button>))}</div>
            {lista.length?<div className="grid gap-3 sm:grid-cols-2">{lista.map(r=><Tarjeta key={r.id} r={r} now={now} onEdit={setEditando} onListo={marcarLlamada} onIncidencia={setIncidenciaDe}/>)}</div>:<Vacio texto={subLista==="activos"?"No hay clientes en seguimiento con los filtros actuales.":subLista==="entregados"?"No hay clientes entregados con los filtros actuales.":subLista==="devueltos"?"No hay clientes devueltos a comercial con los filtros actuales.":"No hay clientes cancelados con los filtros actuales."}/>}
          </div>);
        })()}
        {vista==="tablero" && <VistaTablero registros={visibles} now={now} onEdit={setEditando}/>}
        {vista==="lista" && <VistaLista registros={visibles} now={now} onEdit={setEditando}/>}
        {vista==="dia" && <AgendaDia dia={dia} setDia={setDia} agenda={agenda} onEdit={setEditando}/>}
        {vista==="incidencias" && USR && <Incidencias incs={incs} cargando={incCargando} err={incErr} onRecargar={cargarIncs} onNueva={()=>setIncidenciaDe("libre")}/>}
      </main>

      {incidenciaDe && <FormIncidencia cliente={incidenciaDe==="libre"?null:incidenciaDe} sugerencias={[...new Set(registros.map(r=>r.cliente).filter(Boolean))].sort()} onClose={()=>setIncidenciaDe(null)} onCreada={()=>{cargarIncs();setVista("incidencias");}}/>}
      {editando && <Modal puedeEditar={puedeEditar} inicial={editando==="nuevo"?null:editando} fEjec={fEjec} ejecutivos={ejecutivos} cliPorEjec={cliPorEjec} onClose={()=>setEditando(null)} onSave={guardar}/>}
    </div>
  );
}

/* ---------- Banner ---------- */
function Banner({urgentes,now,onEdit,onListo,hayVencidas}){
  const tono=hayVencidas?"border-red-300 bg-red-50":"border-amber-300 bg-amber-50";
  return (<div className={`mb-4 rounded-xl border ${tono} px-4 py-3`}><div className="flex items-center gap-2 mb-2"><Icon name="bell" size={16} className={hayVencidas?"text-red-600":"text-amber-600"}/><p className={`text-sm font-bold ${hayVencidas?"text-red-700":"text-amber-800"}`}>{urgentes.length} {urgentes.length===1?"llamada":"llamadas"} por atender</p></div><div className="flex flex-wrap gap-2">{urgentes.map(r=>{const venc=estadoCompromiso(r,now)==="vencido";return (<div key={r.id} className={`inline-flex items-center gap-2 rounded-lg border bg-white px-2.5 py-1.5 ${venc?"border-red-300":"border-amber-300"}`}><span className={`h-2 w-2 rounded-full ${venc?"bg-red-500":"bg-amber-500"}`}></span><button onClick={()=>onEdit(r)} className="text-sm font-semibold text-slate-800 hover:underline">{r.cliente}</button>{r.telefono && <a href={`tel:${r.telefono.replace(/[^0-9+]/g,"")}`} className="text-xs text-slate-500 hover:text-slate-800 mono">{r.telefono}</a>}<span className="text-xs text-slate-500 mono">{venc?"venció":""} {hora(r.compromiso)}</span><button onClick={()=>onListo(r.id)} title="Marcar realizada" className="grid h-5 w-5 place-items-center rounded text-emerald-600 hover:bg-emerald-50"><Icon name="check" size={14}/></button></div>);})}</div></div>);
}

/* ---------- Agenda Día ---------- */
function AgendaDia({dia,setDia,agenda,onEdit}){
  return (<div>
    <div className="flex items-center justify-between mb-4 rounded-lg border border-stone-200 bg-white px-3 py-2.5"><button onClick={()=>setDia(addDays(dia,-1))} className="grid h-8 w-8 place-items-center rounded-md hover:bg-stone-100 text-slate-600"><Icon name="left" size={18}/></button><div className="text-center"><p className="text-sm font-bold capitalize text-slate-900">{largo(dia)}</p><button onClick={()=>setDia(HOY)} className="text-xs text-amber-600 hover:underline mono">ir a hoy</button></div><button onClick={()=>setDia(addDays(dia,1))} className="grid h-8 w-8 place-items-center rounded-md hover:bg-stone-100 text-slate-600"><Icon name="right" size={18}/></button></div>
    {agenda.length===0?<Vacio texto="Sin interacciones registradas este día."/>:<div className="space-y-2">{agenda.map(({r,be})=>(<button key={r.id+"-"+be.id} onClick={()=>onEdit(r)} className="flex w-full items-start gap-3 rounded-lg border border-stone-200 bg-white p-3 text-left hover:shadow-sm"><TipoTag tipo={be.tipo}/><div className="min-w-0 flex-1"><div className="flex items-center gap-2"><p className="font-semibold text-slate-900 truncate">{r.cliente}</p><ContactoTag contacto={be.contacto} compacto/></div><p className="text-xs text-slate-500">{r.ejecutivo}</p>{be.resultado && <p className="mt-1 text-sm text-slate-600">{be.resultado}</p>}</div><Badge estatus={r.estatus}/></button>))}</div>}
  </div>);
}

/* ---------- Tablero ---------- */
function VistaTablero({registros,now,onEdit}){
  return (<div className="flex gap-3 overflow-x-auto pb-2">{ESTATUS.map(est=>{const items=registros.filter(r=>r.estatus===est);return (<div key={est} className="min-w-[200px] flex-1"><div className="flex items-center gap-2 mb-2 px-1"><span className={`h-2 w-2 rounded-full ${ESTATUS_COLOR[est].spine}`}></span><h3 className="text-xs font-bold uppercase tracking-wide text-slate-600 leading-tight">{est}</h3><span className="ml-auto text-xs text-slate-400 mono">{items.length}</span></div><div className="space-y-2">{items.map(r=><TarjetaMini key={r.id} r={r} now={now} onEdit={onEdit}/>)}{items.length===0 && <div className="rounded-lg border border-dashed border-stone-300 py-6 text-center text-xs text-slate-400">—</div>}</div></div>);})}</div>);
}

/* ---------- Lista ---------- */
function VistaLista({registros,now,onEdit}){
  const orden=[...registros].sort((a,b)=>a.cliente.localeCompare(b.cliente));
  if(!orden.length)return <Vacio texto="No hay clientes con los filtros actuales."/>;
  return (<div className="overflow-x-auto rounded-lg border border-stone-200 bg-white"><table className="w-full text-sm"><thead><tr className="border-b border-stone-200 text-left text-xs uppercase tracking-wide text-slate-500"><th className="px-3 py-2.5 font-semibold">Cliente / Ejecutivo</th><th className="px-3 py-2.5 font-semibold">Tipo</th><th className="px-3 py-2.5 font-semibold">Equipo</th><th className="px-3 py-2.5 font-semibold">Estatus</th><th className="px-3 py-2.5 font-semibold">Expediente</th><th className="px-3 py-2.5 font-semibold">Últ. interacción</th><th className="px-3 py-2.5 font-semibold">Entrega</th><th className="px-3 py-2.5"></th></tr></thead><tbody>{orden.map(r=>{const st=reqStats(r);const u=ultInter(r);return (<tr key={r.id} className="border-b border-stone-100 last:border-0 hover:bg-stone-50"><td className="px-3 py-2.5"><p className="font-semibold text-slate-900">{r.cliente}</p><p className="text-xs text-slate-500">{r.ejecutivo}{r.telefono?" · "+r.telefono:""}</p></td><td className="px-3 py-2.5 text-xs text-slate-600 whitespace-nowrap">{r.tipoCliente==="Cliente Recurrente"?"Recurrente":"Nuevo"}</td><td className="px-3 py-2.5 text-slate-700 max-w-[170px]">{equiposTxt(r)||<span className="text-slate-300">—</span>}</td><td className="px-3 py-2.5"><Badge estatus={r.estatus}/></td><td className="px-3 py-2.5 whitespace-nowrap">{st.completo?<span className="inline-flex items-center gap-1 text-xs font-semibold text-emerald-600"><Icon name="check" size={12}/>Completo</span>:<span className="text-xs font-medium text-indigo-600 mono">{st.recibido}/{st.aplicables}</span>}</td><td className="px-3 py-2.5 whitespace-nowrap text-xs text-slate-500">{u?`${corto(u.fecha)} · ${u.contacto}`:<span className="text-slate-300">—</span>}</td><td className="px-3 py-2.5 whitespace-nowrap">{r.entregaProgramada?<span className="inline-flex items-center gap-1 text-emerald-700"><Icon name="truck" size={13}/>{corto(r.entregaProgramada)}</span>:<span className="text-slate-300">—</span>}</td><td className="px-3 py-2.5"><button onClick={()=>onEdit(r)} className="text-slate-400 hover:text-slate-700"><Icon name="pencil" size={15}/></button></td></tr>);})}</tbody></table></div>);
}

/* ---------- Expediente bar ---------- */
function primeraInter(r){const b=(r.bitacora||[]).filter(x=>x.fecha).slice().sort((a,b)=>(a.fecha||"").localeCompare(b.fecha||""));return b[0]||null;}
function diasEnGestion(r){const p=primeraInter(r);if(!p)return null;const fin=(r.devueltoComercial&&r.fechaDevuelto)?parse(r.fechaDevuelto):parse(HOY);return Math.max(0,Math.round((fin-parse(p.fecha))/86400000));}
function Cronometro({r}){
  if(["Entregado","Cancelado"].includes(r.estatus))return null;
  const d=diasEnGestion(r); if(d===null)return null;
  const pausado=esDevuelto(r);
  const pct=Math.min(100,Math.max(0,d/60*100)); const vencido=d>60;
  const col=d<=20?"text-emerald-600":d<=40?"text-amber-600":d<=60?"text-orange-600":"text-red-600";
  return (<div className="mt-2">
    <div className="flex items-center justify-between text-xs mb-1"><span className="font-semibold text-slate-600 inline-flex items-center gap-1"><Icon name="clock" size={12}/> Gestión (60 días){pausado&&<span className="ml-1 rounded bg-purple-100 px-1 py-0.5 text-[9px] font-bold text-purple-700">⏸ en comercial</span>}</span><span className={`mono font-bold ${col}`}>{vencido?`Vencido +${d-60}d`:`Día ${d} de 60`}</span></div>
    <div className="relative h-2 w-full rounded-full overflow-hidden" style={{background:"linear-gradient(to right,#22c55e 0%,#22c55e 28%,#fbbf24 40%,#f59e0b 60%,#f97316 78%,#ef4444 100%)"}}><div className="absolute -top-0.5 h-3 w-1 rounded bg-slate-900" style={{left:`calc(${pct}% - 2px)`}}></div></div>
    <p className="mt-1 text-[11px] text-slate-400">{vencido?"Fuera del plazo de 60 días":`Quedan ${60-d} días para entregar`}</p>
  </div>);
}
function ReqBarra({r}){
  const st=reqStats(r);
  if(st.completo)return <div className="mt-2 inline-flex items-center gap-1.5 rounded-md border border-emerald-200 bg-emerald-50 px-2 py-1 text-xs font-semibold text-emerald-700"><Icon name="clip" size={12}/> Expediente completo</div>;
  const pct=st.aplicables?Math.round(st.recibido/st.aplicables*100):0;
  return (<div className="mt-2"><div className="flex items-center justify-between text-xs mb-1"><span className="font-semibold text-slate-600 inline-flex items-center gap-1"><Icon name="clip" size={12}/> Expediente</span><span className="mono text-indigo-600 font-semibold">{st.recibido}/{st.aplicables}</span></div><div className="h-1.5 w-full rounded-full bg-stone-200 overflow-hidden"><div className="h-full bg-indigo-500" style={{width:pct+"%"}}></div></div>{st.faltan.length>0 && <p className="mt-1 text-xs text-slate-500 truncate">Faltan: {st.faltan.slice(0,3).join(", ")}{st.faltan.length>3?` +${st.faltan.length-3}`:""}</p>}</div>);
}

/* ---------- Tags ---------- */
function TipoTag({tipo}){return <span className="rounded border border-stone-200 bg-stone-50 px-1.5 py-0.5 text-[10px] font-bold tracking-wide text-slate-500 mono shrink-0">{TIPO_ABBR[tipo]||tipo}</span>;}
function EmpresaTag({empresa}){return empresa?<span className="rounded bg-slate-800 px-1.5 py-0.5 text-[10px] font-bold text-white mono">{empresa}</span>:null;}
function ClienteTipoTag({tc}){const rec=tc==="Cliente Recurrente";return <span className={`inline-flex items-center gap-0.5 rounded px-1.5 py-0.5 text-[10px] font-bold ${rec?"bg-teal-100 text-teal-700":"bg-sky-100 text-sky-700"}`}><Icon name="user" size={9}/>{rec?"RECURRENTE":"NUEVO"}</span>;}

/* ---------- Tarjeta ---------- */
function Tarjeta({r,now,onEdit,onListo,onIncidencia}){
  const c=ESTATUS_COLOR[r.estatus];const e=estadoCompromiso(r,now);const eqt=equiposTxt(r);const u=ultInter(r);const nb=(r.bitacora||[]).length;
  const ring=e==="vencido"?"ring-2 ring-red-400 border-red-300":e==="proximo"?"ring-2 ring-amber-400 border-amber-300":"border-stone-200";
  return (<div className={`group relative w-full overflow-hidden rounded-xl border bg-white transition-shadow hover:shadow-md ${ring}`}><span className={`absolute inset-y-0 left-0 w-1.5 ${c.spine}`}></span>
    <button onClick={()=>onEdit(r)} className="block w-full p-4 pl-5 text-left">
      <div className="flex items-start justify-between gap-2"><div className="flex items-center gap-2 min-w-0">{e && <span className={`h-2.5 w-2.5 rounded-full shrink-0 ${e==="vencido"?"bg-red-500":e==="proximo"?"bg-amber-500":"bg-sky-400"}`}></span>}<div className="min-w-0"><div className="flex items-center gap-1.5"><p className={`font-bold leading-tight truncate ${e==="vencido"?"text-red-700":e==="proximo"?"text-amber-800":"text-slate-900"}`}>{r.cliente}</p></div><p className="text-xs text-slate-500 mt-0.5">{r.ejecutivo}</p>{r.tipoContrato&&<span className={`mt-1 inline-block rounded border px-1.5 py-0.5 text-[10px] font-bold ${r.tipoContrato==="Notariado"?"border-violet-200 bg-violet-50 text-violet-700":"border-sky-200 bg-sky-50 text-sky-700"}`}>Contrato {r.tipoContrato}</span>}{esDevuelto(r)&&<span className="mt-1 ml-1 inline-block rounded border border-purple-300 bg-purple-50 px-1.5 py-0.5 text-[10px] font-bold text-purple-700">Devuelto a comercial</span>}{esParcial(r)&&<span className="mt-1 ml-1 inline-block rounded border border-amber-300 bg-amber-50 px-1.5 py-0.5 text-[10px] font-bold text-amber-700">Entrega parcial {entregadosCli(r)}/{uniEq(r)}</span>}{(r.folioVenta||r.folioJJ)&&<p className="text-[10px] text-slate-400 mono mt-0.5">{r.folioVenta?`V: ${r.folioVenta}`:""}{r.folioVenta&&r.folioJJ?"  ·  ":""}{r.folioJJ?`JJ: ${r.folioJJ}`:""}</p>}</div></div><div className="flex flex-col items-end gap-1 shrink-0"><Badges r={r}/><div className="flex items-center gap-1"><ClienteTipoTag tc={r.tipoCliente}/><EmpresaTag empresa={r.empresa}/></div></div></div>
      {eqt && <p className="mt-2 text-xs font-medium text-slate-600 inline-flex items-start gap-1"><Icon name="truck" size={12} className="text-slate-400 mt-0.5 shrink-0"/><span>{eqt}</span></p>}
      {r.niv && <p className="mt-1 text-xs text-slate-500 mono truncate">NIV: {String(r.niv).split(/[\n,]+/).map(x=>x.trim()).filter(Boolean).join(", ")}</p>}{r.tipoVenta && <p className="mt-1 text-xs text-slate-500"><span className="font-semibold text-slate-600">{r.tipoVenta}</span>{r.plazo?` · ${r.plazo} meses`:""}</p>}
      <div className="mt-2 rounded-md bg-stone-50 border border-stone-100 px-2 py-1.5 text-xs">{u?(<div className="flex items-start gap-1.5"><Icon name="history" size={12} className="text-slate-400 mt-0.5 shrink-0"/><div className="min-w-0"><span className="font-semibold text-slate-600">{corto(u.fecha)} · {u.tipo} · </span><ContactoTag contacto={u.contacto} inline/>{u.resultado && <span className="text-slate-600"> — {u.resultado}</span>}<span className="text-slate-400 mono"> · {nb} {nb===1?"interacción":"interacciones"}</span></div></div>):<span className="text-slate-400 inline-flex items-center gap-1"><Icon name="history" size={12}/> Sin interacciones aún</span>}</div>
      {r.adicionales&&r.adicionales.length>0 && <div className="mt-2 flex flex-wrap gap-1">{r.adicionales.map(a=><span key={a} className="inline-flex items-center gap-0.5 rounded bg-stone-100 px-1.5 py-0.5 text-[10px] font-medium text-slate-500"><Icon name="tag" size={9}/>{a}</span>)}</div>}
      <Cronometro r={r}/><ReqBarra r={r}/>{numArchivos(r)>0&&<p className="mt-1 text-[11px] font-semibold text-emerald-600">{numArchivos(r)} archivo(s) en el expediente</p>}
      {r.queFalta && <div className="mt-2 flex items-start gap-1.5 rounded-md bg-amber-50 px-2 py-1.5 text-xs text-amber-800"><Icon name="alert" size={13} className="mt-0.5 shrink-0"/><span><span className="font-semibold">Pendiente:</span> {r.queFalta}</span></div>}

  const [f,setF]=useState({...base,niv:base.niv||"",folioVenta:base.folioVenta||"",folioJJ:base.folioJJ||"",tipoContrato:base.tipoContrato||"",entregaFabrica:base.entregaFabrica||"",estatuses:[...(base.estatuses||(base.estatus?[base.estatus]:[ESTATUS[0]]))],equipos:(base.equipos&&base.equipos.length)?base.equipos.map(e=>({...e})):[{tipo:"",cantidad:1}],adicionales:[...(base.adicionales||[])],requisitos:{...reqPend(base.tipoCliente||"Cliente Nuevo"),...(base.requisitos||{})},archivos:JSON.parse(JSON.stringify(base.archivos||{})),entregaModo:base.entregaModo||"",nivsEntrega:(base.nivsEntrega||[]).map(x=>({niv:x.niv||"",entregado:!!x.entregado})),devueltoComercial:!!base.devueltoComercial,fechaDevuelto:base.fechaDevuelto||"",motivoDevuelto:base.motivoDevuelto||"",bitacora:[...(base.bitacora||[])]});

        {/* Bitácora */}
        <div className="rounded-xl border border-slate-200 bg-slate-50 p-3">
          <div className="flex items-center gap-1.5 mb-2 text-xs font-semibold uppercase tracking-wide text-slate-500"><Icon name="history" size={14}/> Registrar interacción</div>
          <div className="grid grid-cols-2 gap-2 mb-2"><input type="date" value={nb.fecha} onChange={e=>setNb({...nb,fecha:e.target.value})} className={inp}/><select value={nb.tipo} onChange={e=>setNb({...nb,tipo:e.target.value})} className={inp}>{TIPOS.map(t=><option key={t}>{t}</option>)}</select></div>
          <div className="grid grid-cols-2 gap-2 mb-2">{CONTACTO.map(op=>{const a=nb.contacto===op;const s=op==="Contestó"?(a?"bg-emerald-600 text-white border-emerald-600":"border-stone-300 text-slate-600 hover:bg-emerald-50"):(a?"bg-red-500 text-white border-red-500":"border-stone-300 text-slate-600 hover:bg-red-50");return <button key={op} onClick={()=>setNb({...nb,contacto:op})} className={`rounded-lg border px-2 py-2 text-sm font-medium ${s}`}>{op}</button>;})}</div>
          <textarea value={nb.resultado} onChange={e=>setNb({...nb,resultado:e.target.value})} rows={2} placeholder="¿Qué pasó en esta interacción? (resultado, qué se pidió, siguiente paso…)" className={inp}/>
          <button onClick={addBit} className="mt-2 inline-flex items-center gap-1 rounded-lg bg-slate-900 px-3 py-1.5 text-xs font-semibold text-white hover:bg-slate-800"><Icon name="plus" size={13}/> Agregar a la bitácora</button>
          {bitOrd.length>0 && (<div className="mt-3 space-y-1.5 border-t border-slate-200 pt-2">{bitOrd.map(be=>(<div key={be.id} className="flex items-start gap-2 rounded-md bg-white border border-stone-200 px-2 py-1.5 text-xs"><TipoTag tipo={be.tipo}/><div className="min-w-0 flex-1"><div className="flex items-center gap-1.5"><input type="date" value={be.fecha||""} onChange={e=>editBit(be.id,"fecha",e.target.value)} disabled={editBitId!==be.id} className={`font-semibold text-slate-600 bg-transparent outline-none ${editBitId===be.id?"border border-stone-300 rounded px-1":"border-0 pointer-events-none"}`}/><ContactoTag contacto={be.contacto} compacto/></div>{editBitId===be.id?<textarea value={be.resultado||""} onChange={e=>editBit(be.id,"resultado",e.target.value)} rows={2} className="mt-1 w-full rounded border border-amber-300 bg-white px-2 py-1 text-slate-700 outline-none focus:border-amber-400" placeholder="Escribe el comentario…"/>:(be.resultado && <p className="text-slate-600 whitespace-pre-wrap">{be.resultado}</p>)}</div>{editBitId===be.id?<button onClick={()=>setEditBitId(null)} title="Listo" className="text-emerald-500 hover:text-emerald-700"><Icon name="check" size={14}/></button>:<button onClick={()=>setEditBitId(be.id)} title="Editar" className="text-slate-300 hover:text-amber-600"><Icon name="pencil" size={13}/></button>}<button onClick={()=>{if(editBitId===be.id)setEditBitId(null);delBit(be.id);}} title="Eliminar" className="text-slate-300 hover:text-red-500"><Icon name="x" size={13}/></button></div>))}</div>)}
        </div>

        <Campo label="Estatus de la solicitud (marca todas las etapas que apliquen)"><div className="flex flex-wrap gap-1.5">{ESTATUS.map(est=>{const on=(f.estatuses||[]).includes(est);return <button key={est} onClick={()=>toggleEst(est)} className={`rounded-full border px-2.5 py-1 text-xs font-medium ${on?ESTATUS_COLOR[est].chip+" ring-2 ring-offset-1 ring-slate-300":"border-stone-300 text-slate-500 hover:bg-stone-50"}`}>{on?"✓ ":""}{est}</button>;})}</div><span className="mt-1.5 block text-[11px] text-slate-400">En el tablero y los conteos aparece según la etapa más avanzada marcada: <span className="font-semibold text-slate-600">{principal(f.estatuses||[])}</span></span></Campo>

        <div className="rounded-xl border border-stone-200 bg-stone-50 p-3"><div className="flex items-center justify-between mb-2"><div className="flex items-center gap-1.5 text-xs font-semibold uppercase tracking-wide text-slate-500"><Icon name="clip" size={14}/> Requisitos · {f.tipoCliente==="Cliente Recurrente"?"Recurrente":"Nuevo"}</div><span className={`text-xs font-bold mono ${st.completo?"text-emerald-600":"text-indigo-600"}`}>{st.completo?"Completo":`${st.recibido}/${st.aplicables}`}</span></div><p className="text-xs text-slate-400 mb-2">Clic para alternar: <span className="text-slate-500 font-medium">Pendiente → Recibido → No aplica</span> · 📷 escanea con la cámara · 📎 sube archivo o PDF</p><div className="space-y-1.5">{reqListFor(f.tipoCliente).map(k=>{const v=f.requisitos[k]||"pendiente";const s=v==="recibido"?"bg-emerald-600 text-white border-emerald-600":v==="na"?"bg-stone-100 text-slate-400 border-stone-200 line-through":"bg-white border-stone-300 text-slate-600 hover:bg-stone-50";const lista=((f.archivos||{})[k])||[];return (<div key={k} className="rounded-lg border border-stone-200 bg-white p-1.5"><div className="flex items-center gap-1.5"><button onClick={()=>ciclaReq(k)} className={`flex flex-1 min-w-0 items-center gap-1.5 rounded-md border px-2.5 py-1.5 text-xs font-medium text-left ${s}`}><span className="shrink-0">{v==="recibido"?<Icon name="check" size={13}/>:v==="na"?<Icon name="x" size={12}/>:<span className="inline-block h-3 w-3 rounded-full border border-current opacity-40"></span>}</span><span className="truncate">{k}</span>{lista.length>0&&<span className="ml-auto shrink-0 rounded-full bg-black/10 px-1.5 py-0.5 text-[10px] font-bold">{lista.length}</span>}</button><label title="Escanear con la cámara" className="cursor-pointer shrink-0 rounded-md border border-emerald-300 bg-emerald-50 px-2 py-1.5 text-xs font-semibold text-emerald-700 hover:bg-emerald-100">📷<input type="file" accept="image/*" capture="environment" className="hidden" onChange={e=>{const fl=e.target.files[0];if(fl)subirArchivo(k,fl);e.target.value="";}}/></label><label title="Subir archivo o PDF" className="cursor-pointer shrink-0 rounded-md border border-stone-300 bg-white px-2 py-1.5 text-xs font-semibold text-slate-600 hover:bg-stone-50">📎<input type="file" accept="image/*,application/pdf" className="hidden" onChange={e=>{const fl=e.target.files[0];if(fl)subirArchivo(k,fl);e.target.value="";}}/></label></div>{subiendo===k && <p className="mt-1 text-[11px] font-medium text-sky-600">Subiendo…</p>}{lista.length>0 && <div className="mt-1.5 flex flex-wrap gap-1.5">{lista.map((a,i)=>(<div key={i} className="relative"><a href={a.url} target="_blank" rel="noopener"><img src={`https://drive.google.com/thumbnail?id=${a.id}&sz=w120`} alt={a.nombre} className="h-12 w-12 rounded border border-stone-200 object-cover bg-stone-50"/></a><button onClick={()=>quitarArchivo(k,i)} className="absolute -right-1 -top-1 grid h-4 w-4 place-items-center rounded-full border border-stone-200 bg-white text-slate-400 shadow hover:text-red-500"><Icon name="x" size={9}/></button></div>))}</div>}</div>);})}</div></div>

        <Campo label="Pendiente actual (nota)"><textarea value={f.queFalta} onChange={e=>set("queFalta",e.target.value)} rows={2} placeholder="Algo fuera del expediente (ej. cliente confirma plazo)…" className={inp}/></Campo>
        <div className="rounded-xl border border-stone-200 bg-stone-50 p-3 space-y-3"><div className="flex items-center gap-1.5 text-xs font-semibold uppercase tracking-wide text-slate-500"><Icon name="alarm" size={14}/> Próximo compromiso de llamada</div><input type="datetime-local" value={f.compromiso} onChange={e=>set("compromiso",e.target.value)} className={inp}/>{f.compromiso && <label className="flex items-center gap-2 text-sm text-slate-600"><input type="checkbox" checked={f.compromisoCumplido} onChange={e=>set("compromisoCumplido",e.target.checked)} className="h-4 w-4"/> Ya realicé esta llamada</label>}<p className="text-xs text-slate-400">Con fecha y hora, el cliente se marca en rojo (vencida) o ámbar (por marcar pronto).</p></div>
        <div className="grid grid-cols-2 gap-3"><Campo label="Entrega de fábrica o taller" hint="Cuándo llega el equipo"><input type="date" value={f.entregaFabrica} onChange={e=>set("entregaFabrica",e.target.value)} className={inp}/></Campo><Campo label="Fecha de entrega al cliente"><input type="date" value={f.entregaProgramada} onChange={e=>set("entregaProgramada",e.target.value)} className={inp}/></Campo></div>
        <Campo label="Notas (opcional)"><textarea value={f.notas} onChange={e=>set("notas",e.target.value)} rows={2} className={inp}/></Campo>
        {inicial && inicial.id>0 && <HistorialCambios id={inicial.id}/>}
      </div>
      <div className="sticky bottom-0 flex justify-end gap-2 border-t border-stone-200 bg-white px-5 py-3"><button onClick={onClose} className="rounded-lg px-3.5 py-2 text-sm font-semibold text-slate-600 hover:bg-stone-100">Cancelar</button><button onClick={()=>valido&&guardarLimpio()} disabled={!valido||!puedeEditar} title={puedeEditar?"":"Modo consulta: no puedes guardar"} className="rounded-lg border border-forza bg-forza px-5 py-2 text-sm font-bold text-forza-tinta hover:brightness-95 disabled:opacity-40">{inicial?"Guardar cambios":"Crear cliente"}</button></div>
    </div>
  </div>);
}

/* ---------- Registro de cambios ---------- */
function HistorialCambios({id}){
  const [items,setItems]=useState(null);const [err,setErr]=useState("");
  useEffect(()=>{let vivo=true;apiHistorial(id).then(d=>{if(vivo)setItems(Array.isArray(d)?d:[]);}).catch(e=>{if(vivo)setErr(e.message);});return()=>{vivo=false;};},[id]);
  const fmt=s=>{const d=new Date(s);return `${d.getDate()} ${MESES[d.getMonth()].slice(0,3)} ${d.getFullYear()} · ${pad(d.getHours())}:${pad(d.getMinutes())}`;};
  return (<div className="rounded-lg border border-stone-200 p-3">
    <h3 className="text-sm font-bold text-carbon mb-2 inline-flex items-center gap-1.5"><Icon name="history" size={15}/> Últimos cambios</h3>
    {err?<p className="text-xs text-red-600">No se pudo cargar el historial: {err}</p>:
     items===null?<p className="text-xs text-slate-400">Cargando…</p>:
     items.length===0?<p className="text-xs text-slate-400">Sin cambios registrados desde la migración.</p>:
     <ul className="space-y-1">{items.slice(0,10).map((c,i)=>(<li key={i} className="flex flex-wrap items-baseline gap-x-2 text-xs"><span className={`rounded px-1.5 py-0.5 text-[10px] font-bold ${c.accion==="alta"?"bg-forza-suave text-carbon":"bg-slate-100 text-slate-600"}`}>{c.accion==="alta"?"Alta":"Edición"}</span><span className="text-slate-500">{fmt(c.fecha)}</span>{c.usuario&&<span className="font-semibold text-slate-700">{c.usuario}</span>}</li>))}</ul>}
  </div>);
}


/* ================= INCIDENCIAS DE CALIDAD ================= */
const EMPRESA_LARGA={"HT":"HT Rent","JJ":"JJ Forza","3C":"3C","HT RENT":"HT Rent","JJ FORZA":"JJ Forza"};
function empresaDe(r){const e=String(r&&r.empresa||"").trim();return EMPRESA_LARGA[e.toUpperCase()]||e;}
const fechaInc=s=>{if(!s)return"";const d=new Date(s);return `${d.getDate()} ${MESES[d.getMonth()].slice(0,3)} · ${pad(d.getHours())}:${pad(d.getMinutes())}`;};

/* ---- Formulario: se abre desde la tarjeta o la ficha del cliente ---- */
function FormIncidencia({cliente,onClose,onCreada,sugerencias}){
  const libre=!cliente;
  const [manual,setManual]=useState({cliente:"",empresa:"JJ Forza"});
  const [eqLibres,setEqLibres]=useState([{tipo:"",niv:""}]);
  const empresa=libre?manual.empresa:empresaDe(cliente);
  const [opciones,setOpciones]=useState(null);
  const [cat,setCat]=useState("");const [subs,setSubs]=useState([]);
  const [equipos,setEquipos]=useState([]);
  const [f,setF]=useState({descripcion:"",requerimiento:"",ocurrio:HOY,ubicacion:(cliente&&cliente.patioEntrega)||""});
  const [archivos,setArchivos]=useState([]);
  const [msg,setMsg]=useState("");const [guardando,setGuardando]=useState(false);
  const inp="w-full rounded-lg border border-stone-300 bg-white px-3 py-2 text-sm outline-none focus:border-carbon focus:ring-2 focus:ring-forza-suave";
  useEffect(()=>{let vivo=true;incOpciones(empresa).then(o=>{if(!vivo)return;setOpciones(o||{});const cs=Object.keys(o||{});if(cs.length===1)setCat(cs[0]);}).catch(e=>setMsg("No se pudieron cargar las opciones: "+e.message));return()=>{vivo=false;};},[empresa]);
  const lista=((cliente&&cliente.equipos)||[]).filter(e=>e.tipo);
  const nivs=String((cliente&&cliente.niv)||"").split(/[\n,]+/).map(x=>x.trim()).filter(Boolean);
  const toggleEq=i=>setEquipos(p=>p.includes(i)?p.filter(x=>x!==i):[...p,i]);
  const toggleSub=sc=>setSubs(p=>p.includes(sc)?p.filter(x=>x!==sc):[...p,sc]);
  async function agregarArchivo(file){try{const c=await comprimir(file);setArchivos(p=>[...p,c]);}catch(e){setMsg("No se pudo leer el archivo: "+e.message);}}
  const valido=cat&&subs.length>0&&f.descripcion.trim().length>5&&(!libre||manual.cliente.trim().length>2);
  async function enviar(){
    if(!valido||guardando)return;setGuardando(true);setMsg("");
    try{
      const eqs=libre
        ? eqLibres.filter(e=>String(e.tipo||"").trim()||String(e.niv||"").trim()).map(e=>({tipo:(e.tipo||"").trim(),marca:"",anio:"",condicion:"",niv:(e.niv||"").trim()}))
        : equipos.map(i=>({tipo:lista[i].tipo,marca:lista[i].marca||"",anio:lista[i].anio||"",condicion:lista[i].condicion||"",niv:nivs[i]||""}));
      const r=await incCrear({cliente_id:libre?null:cliente.id,cliente:libre?manual.cliente.trim():cliente.cliente,empresa:empresa,equipos:eqs,
        categoria:cat,subcategorias:subs,descripcion:f.descripcion.trim(),requerimiento:f.requerimiento.trim(),
        ocurrio:f.ocurrio,ubicacion:f.ubicacion});
      for(const a of archivos){await incArchivo(r.id,a.nombre,a.mime,a.b64);}
      onCreada&&onCreada(r);onClose();
    }catch(e){setMsg("No se pudo levantar la incidencia: "+e.message);}
    finally{setGuardando(false);}
  }
  return (<div className="fixed inset-0 z-[60] flex justify-end" style={{background:"rgba(10,12,15,.6)"}} onClick={onClose}>
    <div className="h-full w-full sm:max-w-xl overflow-y-auto bg-white shadow-2xl" onClick={e=>e.stopPropagation()}>
      <div className="sticky top-0 z-10 flex items-center justify-between gap-3 border-b-4 border-forza bg-carbon px-5 py-3.5">
        <div className="min-w-0"><h2 className="font-display text-xl text-white leading-tight truncate">Levantar incidencia</h2>
          <p className="text-[12px] text-plata truncate">{libre?("Cliente fuera de la cartera · "+empresa):(cliente.cliente+" · "+empresa)}</p></div>
        <button onClick={onClose} aria-label="Cerrar" className="grid h-9 w-9 shrink-0 place-items-center rounded border border-carbon-edge text-white hover:bg-carbon-2"><Icon name="x" size={18}/></button>
      </div>
      <div className="p-5 space-y-4">
        {libre && <div className="rounded-lg border border-forza bg-forza-suave/60 p-3 space-y-3">
          <p className="text-xs font-semibold text-carbon">Incidencia de un cliente que no está en la cartera de la app.</p>
          <Campo label="Nombre del cliente"><input list="dl-inc-cli" value={manual.cliente} onChange={e=>setManual({...manual,cliente:e.target.value})} placeholder="Nombre o razón social…" className={inp}/></Campo>
          <datalist id="dl-inc-cli">{(sugerencias||[]).map(x=><option key={x} value={x}/>)}</datalist>
          <div><span className="mb-1 block text-xs font-semibold uppercase tracking-wide text-slate-500">Empresa</span>
            <div className="grid grid-cols-3 gap-2">{["HT Rent","JJ Forza","3C"].map(e=>(
              <button key={e} onClick={()=>{setManual({...manual,empresa:e});setCat("");setSubs([]);}} className={`rounded-lg border px-2 py-2 text-sm font-medium ${manual.empresa===e?"border-carbon bg-carbon text-white":"border-stone-300 text-slate-600 hover:bg-white"}`}>{e}</button>))}</div>
            <p className="mt-1 text-[11px] text-slate-500">Define a quién le toca atender la incidencia.</p>
          </div>
          <div><span className="mb-1 block text-xs font-semibold uppercase tracking-wide text-slate-500">Equipos involucrados</span>
            <div className="space-y-2">{eqLibres.map((e,i)=>(
              <div key={i} className="flex items-center gap-2">
                <input value={e.tipo} onChange={ev=>setEqLibres(p=>p.map((x,j)=>j===i?{...x,tipo:ev.target.value}:x))} placeholder="Tipo de equipo" className="flex-1 min-w-0 rounded-lg border border-stone-300 bg-white px-3 py-2 text-sm outline-none focus:border-carbon"/>
                <input value={e.niv} onChange={ev=>setEqLibres(p=>p.map((x,j)=>j===i?{...x,niv:ev.target.value}:x))} placeholder="NIV" className="w-44 shrink-0 rounded-lg border border-stone-300 bg-white px-3 py-2 text-sm mono outline-none focus:border-carbon"/>
                {eqLibres.length>1 && <button onClick={()=>setEqLibres(p=>p.filter((_,j)=>j!==i))} className="grid h-8 w-8 shrink-0 place-items-center rounded-md text-slate-400 hover:bg-white hover:text-red-500"><Icon name="x" size={16}/></button>}
              </div>))}</div>
            <button onClick={()=>setEqLibres(p=>[...p,{tipo:"",niv:""}])} className="mt-2 inline-flex items-center gap-1 text-sm font-semibold text-carbon hover:opacity-70"><Icon name="plus" size={15}/> Agregar equipo</button>
          </div>
        </div>}
        {!libre && <div><span className="mb-1 block text-xs font-semibold uppercase tracking-wide text-slate-500">Equipos involucrados</span>
          {lista.length===0?<p className="text-xs text-slate-400">Este cliente no tiene equipos capturados.</p>:
          <div className="space-y-1.5">{lista.map((e,i)=>(
            <button key={i} onClick={()=>toggleEq(i)} className={`flex w-full items-center gap-2 rounded-lg border px-3 py-2 text-left text-sm ${equipos.includes(i)?"border-carbon bg-forza-suave":"border-stone-300 hover:bg-stone-50"}`}>
              <span className={`grid h-5 w-5 shrink-0 place-items-center rounded border ${equipos.includes(i)?"border-carbon bg-carbon text-white":"border-stone-300 text-transparent"}`}><Icon name="check" size={12}/></span>
              <span className="min-w-0"><span className="font-semibold">{e.cantidad||1}× {e.tipo}</span>{e.marca?" · "+e.marca:""}{e.anio?" "+e.anio:""}
                {nivs[i]&&<span className="block text-[11px] text-slate-500 mono">NIV: {nivs[i]}</span>}</span>
            </button>))}</div>}
        </div>}
        <div><span className="mb-1 block text-xs font-semibold uppercase tracking-wide text-slate-500">Tipo de incidencia</span>
          {opciones===null?<p className="text-xs text-slate-400">Cargando opciones…</p>:
           Object.keys(opciones).length===0?<p className="text-xs text-red-600">Para {empresa} no hay tipos de incidencia configurados.</p>:
          <div className="space-y-2">
            <div className="grid grid-cols-3 gap-2">{Object.keys(opciones).map(c=>(
              <button key={c} onClick={()=>{setCat(c);setSubs([]);}} className={`rounded-lg border px-2 py-2 text-sm font-medium ${cat===c?"border-carbon bg-carbon text-white":"border-stone-300 text-slate-600 hover:bg-stone-50"}`}>{c}</button>))}</div>
            {cat && <div className="flex flex-wrap gap-1.5">{(opciones[cat]||[]).map(sc=>(
              <button key={sc} onClick={()=>toggleSub(sc)} className={`rounded-full border px-3 py-1 text-xs font-semibold ${subs.includes(sc)?"border-forza bg-forza text-forza-tinta":"border-stone-300 text-slate-600 hover:bg-stone-50"}`}>{subs.includes(sc)?"✓ ":""}{sc}</button>))}</div>}
            {cat && <p className="text-[11px] text-slate-400">Puedes marcar más de una.</p>}
          </div>}
        </div>
        <Campo label="¿Qué ocurrió?"><textarea rows={4} value={f.descripcion} onChange={e=>setF({...f,descripcion:e.target.value})} placeholder="Describe el desperfecto o el detalle con el equipo…" className={inp}/></Campo>
        <Campo label="¿Qué se requiere de Calidad? (opcional)"><textarea rows={2} value={f.requerimiento} onChange={e=>setF({...f,requerimiento:e.target.value})} className={inp}/></Campo>
        <div className="grid grid-cols-2 gap-3">
          <Campo label="Fecha en que ocurrió"><input type="date" value={f.ocurrio} onChange={e=>setF({...f,ocurrio:e.target.value})} className={inp}/></Campo>
          <Campo label="Ubicación"><select value={f.ubicacion} onChange={e=>setF({...f,ubicacion:e.target.value})} className={inp}><option value="">— Selecciona —</option>{PATIOS.map(p=><option key={p}>{p}</option>)}<option>Con el cliente</option><option>En tránsito</option></select></Campo>
        </div>
        <div><span className="mb-1 block text-xs font-semibold uppercase tracking-wide text-slate-500">Evidencias</span>
          <div className="flex flex-wrap gap-2">
            <label className="cursor-pointer rounded-md border border-emerald-300 bg-emerald-50 px-3 py-1.5 text-xs font-semibold text-emerald-700 hover:bg-emerald-100">📷 Cámara<input type="file" accept="image/*" capture="environment" className="hidden" onChange={e=>{const fl=e.target.files[0];if(fl)agregarArchivo(fl);e.target.value="";}}/></label>
            <label className="cursor-pointer rounded-md border border-stone-300 bg-white px-3 py-1.5 text-xs font-semibold text-slate-600 hover:bg-stone-50">📎 Archivo o PDF<input type="file" accept="image/*,application/pdf" className="hidden" onChange={e=>{const fl=e.target.files[0];if(fl)agregarArchivo(fl);e.target.value="";}}/></label>
          </div>
          {archivos.length>0 && <ul className="mt-2 space-y-1">{archivos.map((a,i)=>(<li key={i} className="flex items-center justify-between rounded border border-stone-200 px-2 py-1 text-xs"><span className="truncate">{a.nombre}</span><button onClick={()=>setArchivos(p=>p.filter((_,j)=>j!==i))} className="text-slate-400 hover:text-red-500"><Icon name="x" size={13}/></button></li>))}</ul>}
        </div>
        {msg && <p className="rounded-lg border border-l-[6px] border-red-500 bg-red-50 px-3 py-2 text-xs font-semibold text-red-700">{msg}</p>}
      </div>
      <div className="sticky bottom-0 flex justify-end gap-2 border-t border-stone-200 bg-white px-5 py-3">
        <button onClick={onClose} className="rounded-lg px-3.5 py-2 text-sm font-semibold text-slate-600 hover:bg-stone-100">Cancelar</button>
        <button onClick={enviar} disabled={!valido||guardando} className="rounded-lg border border-forza bg-forza px-5 py-2 text-sm font-bold text-forza-tinta hover:brightness-95 disabled:opacity-40">{guardando?"Enviando…":"Levantar incidencia"}</button>
      </div>
    </div>
  </div>);
}

/* ---- Detalle y gestión de una incidencia ---- */
async function pdfDictamen(inc, d, conCostos){
  const {jsPDF}=window.jspdf; const doc=new jsPDF({unit:"pt",format:"letter"});
  const W=doc.internal.pageSize.getWidth(), M=40; let y=0;
  const linea=(t,x,yy,op)=>{doc.text(String(t==null?"":t),x,yy,op);};
  // Encabezado
  doc.setFillColor(21,24,28); doc.rect(0,0,W,70,"F");
  doc.setFillColor(255,234,25); doc.rect(0,70,W,5,"F");
  doc.setTextColor(255,255,255); doc.setFont("helvetica","bolditalic"); doc.setFontSize(20);
  linea("REPORTE DE INSPECCIÓN DE UNIDAD",M,34);
  doc.setFontSize(10); doc.setFont("helvetica","normal"); doc.setTextColor(200,205,210);
  linea((d.folio||"")+"  ·  Incidencia "+(inc.folio||"")+"  ·  JJ FORZA SEMI-REMOLQUES",M,54);
  y=100; doc.setTextColor(20,20,20); doc.setFontSize(10);
  const campo=(et,val,x,yy,w)=>{doc.setFont("helvetica","bold");linea(et,x,yy);
    doc.setFont("helvetica","normal");const tx=doc.splitTextToSize(String(val==null?"":val),w);doc.text(tx,x+doc.getTextWidth(et)+6,yy);return tx.length;};
  campo("TIPO DE UNIDAD:", d.tipo_unidad||"", M, y, 200); campo("FECHA:", (d.emitido_en||d.creado||"").slice(0,10), W/2+20, y, 120); y+=18;
  campo("NIV:", d.nivs||"", M, y, 220); campo("COLOR:", d.color||"", W/2+20, y, 120); y+=18;
  campo("CLIENTE:", inc.cliente||"", M, y, 240); campo("EMPRESA:", inc.empresa||"", W/2+20, y, 120); y+=18;
  campo("TIPO DE INCIDENCIA:", (inc.categoria||"")+" · "+((inc.subcategorias||[]).join(", ")), M, y, 320); y+=24;
  const bloque=(tit,txt)=>{doc.setFont("helvetica","bold");doc.setFontSize(10);linea(tit,M,y);y+=14;
    doc.setFont("helvetica","normal");const tx=doc.splitTextToSize(String(txt||"—"),W-2*M);doc.text(tx,M,y);y+=tx.length*12+12;};
  bloque("DESCRIPCIÓN DE LA INCIDENCIA REPORTADA POR EL CLIENTE:", d.reporte_cliente||inc.descripcion);
  bloque("HALLAZGOS DE LA INSPECCIÓN:", d.hallazgos);
  // Tabla de retrabajo
  doc.setFont("helvetica","bold"); doc.setFillColor(236,238,240);
  const anchoDet=conCostos?300:400;
  doc.rect(M,y-11,W-2*M,18,"F"); linea("DETALLE DEL RETRABAJO",M+4,y+1);
  if(conCostos) linea("COSTO MXN",M+anchoDet+10,y+1);
  linea("RESPONSABLE",M+anchoDet+(conCostos?100:10),y+1); y+=22;
  doc.setFont("helvetica","normal");
  (d.renglones||[]).forEach(r=>{
    if(y>700){doc.addPage();y=60;}
    const tx=doc.splitTextToSize(String(r.detalle||""),anchoDet-10); doc.text(tx,M+4,y);
    if(conCostos) linea(r.costo===""||r.costo==null?"":dinero(r.costo),M+anchoDet+10,y);
    linea(r.responsable||"",M+anchoDet+(conCostos?100:10),y);
    y+=Math.max(tx.length*12,14)+4;
  });
  if(conCostos){ y+=8; doc.setFont("helvetica","bold");
    linea("SUBTOTAL: "+dinero(d.subtotal),W-M-180,y); y+=14;
    linea("IVA 16%: "+dinero(d.iva),W-M-180,y); y+=14;
    doc.setFontSize(12); linea("TOTAL: "+dinero(d.total),W-M-180,y); doc.setFontSize(10); y+=20; }
  if(d.observaciones){ doc.setFont("helvetica","normal"); y+=6; bloque("OBSERVACIONES:", d.observaciones); }
  doc.setFont("helvetica","normal"); doc.setTextColor(110,110,110); doc.setFontSize(9);
  y+=10; linea("Emitió: "+(d.emitido_por||"")+"  ·  "+(d.emitido_en||"").slice(0,10),M,y);
  // Fotos
  const fotos=(inc.adjuntos||[]).filter(a=>/^image\//.test(a.mime)).slice(0,6);
  if(fotos.length){
    doc.addPage(); doc.setTextColor(20,20,20); doc.setFont("helvetica","bold"); doc.setFontSize(12);
    linea("EVIDENCIAS FOTOGRÁFICAS",M,50); let px=M, py=70;
    for(const f of fotos){
      try{ const a=await incArchivoLeer(f.id);
        doc.addImage("data:"+a.mime+";base64,"+a.datos,"JPEG",px,py,240,180,undefined,"FAST");
        px += 260; if(px>W-2*M){px=M; py+=200;}
        if(py>600){doc.addPage(); px=M; py=60;}
      }catch(e){}
    }
  }
  doc.save((d.folio||"dictamen")+(conCostos?"-interno":"-cliente")+".pdf");
}

function FormDictamen({inc, dic, onClose, onListo}){
  const [f,setF]=useState(()=>({
    tipo_unidad: dic&&dic.tipo_unidad || ((inc.equipos||[])[0]||{}).tipo || "",
    nivs: dic&&dic.nivs || (inc.equipos||[]).map(e=>e.niv).filter(Boolean).join(", "),
    color: dic&&dic.color || "",
    reporte_cliente: dic&&dic.reporte_cliente || inc.descripcion || "",
    hallazgos: dic&&dic.hallazgos || "",
    observaciones: dic&&dic.observaciones || "",
    renglones: (dic&&dic.renglones&&dic.renglones.length?dic.renglones:[{detalle:"",costo:"",responsable:"JJ Forza"}])

  const [err,setErr]=useState("");const [ocupado,setOcupado]=useState(false);const [subiendo,setSubiendo]=useState(false);
  const inp="w-full rounded-lg border border-stone-300 bg-white px-3 py-2 text-sm outline-none focus:border-carbon focus:ring-2 focus:ring-forza-suave";
  const setR=(i,k,v)=>setF(p=>({...p,renglones:p.renglones.map((r,j)=>j===i?{...r,[k]:v}:r)}));
  const sub=f.renglones.reduce((s,r)=>s+(Number(r.costo)||0),0);
  async function guardar(emitir){
    if(ocupado)return; setOcupado(true); setErr("");
    try{
      const limpios=f.renglones.filter(r=>String(r.detalle||"").trim()).map(r=>({detalle:r.detalle.trim(),costo:r.costo===""?null:Number(r.costo),responsable:r.responsable||""}));
      await dicGuardar(inc.id,{...f,renglones:limpios},emitir);
      onListo&&onListo(); if(emitir)onClose();
      else setErr("Borrador guardado.");
    }catch(e){setErr(e.message);}finally{setOcupado(false);}
  }
  async function foto(file){try{setSubiendo(true);const c=await comprimir(file);await incArchivo(inc.id,c.nombre,c.mime,c.b64);onListo&&onListo();}catch(e){setErr(e.message);}finally{setSubiendo(false);}}
  return (<div className="fixed inset-0 z-[70] flex justify-end" style={{background:"rgba(10,12,15,.65)"}} onClick={onClose}>
    <div className="h-full w-full sm:max-w-2xl overflow-y-auto bg-white shadow-2xl" onClick={e=>e.stopPropagation()}>
      <div className="sticky top-0 z-10 flex items-center justify-between gap-3 border-b-4 border-forza bg-carbon px-5 py-3.5" style={{paddingTop:"calc(14px + env(safe-area-inset-top,0px))"}}>
        <div className="min-w-0"><h2 className="font-display text-xl text-white leading-tight">Dictamen de inspección</h2>
          <p className="text-[12px] text-plata truncate">{inc.folio} · {inc.cliente} · {inc.empresa}</p></div>
        <button onClick={onClose} aria-label="Cerrar" className="grid h-9 w-9 shrink-0 place-items-center rounded border border-carbon-edge text-white hover:bg-carbon-2"><Icon name="x" size={18}/></button>
      </div>
      <div className="p-5 space-y-4">
        <div className="grid gap-3 sm:grid-cols-2">
          <Campo label="Tipo de unidad"><input value={f.tipo_unidad} onChange={e=>setF({...f,tipo_unidad:e.target.value})} className={inp}/></Campo>
          <Campo label="Color"><input value={f.color} onChange={e=>setF({...f,color:e.target.value})} className={inp} placeholder="ROJO, AZUL…"/></Campo>
        </div>
        <Campo label="NIV de la(s) unidad(es)"><input value={f.nivs} onChange={e=>setF({...f,nivs:e.target.value})} className={inp+" mono"}/></Campo>
        <Campo label="Lo que reportó el cliente"><textarea rows={3} value={f.reporte_cliente} onChange={e=>setF({...f,reporte_cliente:e.target.value})} className={inp}/></Campo>
        <Campo label="Hallazgos de la inspección"><textarea rows={4} value={f.hallazgos} onChange={e=>setF({...f,hallazgos:e.target.value})} className={inp} placeholder="Qué se encontró al revisar la unidad…"/></Campo>
        <div>
          <span className="mb-1 block text-xs font-semibold uppercase tracking-wide text-slate-500">Detalle del retrabajo</span>
          <div className="space-y-2">{f.renglones.map((r,i)=>(

                {f.renglones.length>1 && <button onClick={()=>setF(p=>({...p,renglones:p.renglones.filter((_,j)=>j!==i)}))} className="grid h-8 w-8 shrink-0 place-items-center rounded-md text-slate-400 hover:bg-stone-100 hover:text-red-500"><Icon name="x" size={16}/></button>}
              </div>

                <span className="text-[11px] font-medium text-slate-400">Costo MXN</span>
                <input type="number" inputMode="decimal" min="0" value={r.costo} onChange={e=>setR(i,"costo",e.target.value)} className="w-32 rounded-lg border border-stone-300 bg-white px-2 py-1 text-sm mono outline-none focus:border-carbon"/>
                <select value={r.responsable} onChange={e=>setR(i,"responsable",e.target.value)} className="rounded-lg border border-stone-300 bg-white px-2 py-1 text-sm outline-none focus:border-carbon">{RESPONSABLES.map(x=><option key={x}>{x}</option>)}</select>
              </div>
            </div>))}
          </div>
          <div className="mt-2 flex flex-wrap items-center justify-between gap-2">
            <button onClick={()=>setF(p=>({...p,renglones:[...p.renglones,{detalle:"",costo:"",responsable:"JJ Forza"}]}))} className="inline-flex items-center gap-1 text-sm font-semibold text-carbon hover:opacity-70"><Icon name="plus" size={15}/> Agregar renglón</button>
            <span className="text-sm font-bold text-slate-700">Subtotal <span className="mono">{dinero(sub)}</span> · IVA <span className="mono">{dinero(sub*0.16)}</span> · Total <span className="mono text-carbon">{dinero(sub*1.16)}</span></span>
          </div>

        <Campo label="Observaciones (opcional)"><textarea rows={2} value={f.observaciones} onChange={e=>setF({...f,observaciones:e.target.value})} className={inp}/></Campo>
        <div className="rounded-lg border border-stone-200 p-3">

            {subiendo && <span className="self-center text-xs font-semibold text-sky-600">Subiendo…</span>}
          </div>
          <p className="mt-1 text-[11px] text-slate-400">Las fotos se agregan a la incidencia y salen en el PDF.</p>
        </div>
        {err && <p className={`rounded-lg border border-l-[6px] px-3 py-2 text-xs font-semibold ${/Borrador/.test(err)?"border-forza bg-forza-suave text-carbon":"border-red-500 bg-red-50 text-red-700"}`}>{err}</p>}
      </div>
      <div className="sticky bottom-0 flex flex-wrap justify-end gap-2 border-t border-stone-200 bg-white px-5 py-3" style={{paddingBottom:"calc(12px + env(safe-area-inset-bottom,0px))"}}>
        <button onClick={onClose} className="rounded-lg px-3.5 py-2 text-sm font-semibold text-slate-600 hover:bg-stone-100">Cancelar</button>
        <button onClick={()=>guardar(false)} disabled={ocupado} className="rounded-lg border border-stone-300 px-4 py-2 text-sm font-semibold text-slate-700 hover:bg-stone-50 disabled:opacity-40">Guardar borrador</button>
        <button onClick={()=>guardar(true)} disabled={ocupado} className="rounded-lg border border-forza bg-forza px-5 py-2 text-sm font-bold text-forza-tinta hover:brightness-95 disabled:opacity-40">{ocupado?"Enviando…":"Emitir dictamen"}</button>
      </div>
    </div>
  </div>);
}

        <div className="rounded-lg border border-stone-200 p-3">
          <h3 className="text-xs font-bold uppercase tracking-wide text-slate-500 mb-2">Bitácora</h3>
          <ul className="space-y-1.5">{(d.eventos||[]).map((e,i)=>(<li key={i} className="text-xs">
            <span className="font-semibold text-slate-700">{e.nombre||"—"}</span> <span className="rounded bg-slate-100 px-1.5 py-0.5 text-[10px] font-bold text-slate-600">{e.accion}</span> <span className="text-slate-400">{fechaInc(e.fecha)}</span>
            {e.comentario && <p className="text-slate-600 whitespace-pre-line">{e.comentario}</p>}</li>))}</ul>
        </div>
        {USR&&USR.nivel!=="monitor"&&d.estado!=="Cerrada" && <div className="rounded-lg border border-stone-200 p-3 space-y-2">
          <textarea rows={3} value={txt} onChange={e=>setTxt(e.target.value)} placeholder="Escribe un comentario o la resolución…" className={inp}/>
          <div className="flex flex-wrap gap-2">
            <button onClick={()=>accion("comentar")} disabled={ocupado||!txt.trim()} className="rounded-lg border border-stone-300 px-3 py-1.5 text-xs font-semibold text-slate-700 hover:bg-stone-50 disabled:opacity-40">Comentar</button>
            {esCalidad&&d.estado==="Abierta" && <button onClick={()=>accion("tomar")} disabled={ocupado} className="rounded-lg border border-carbon bg-carbon px-3 py-1.5 text-xs font-bold text-white hover:bg-carbon-2">Tomar incidencia</button>}
            {esCalidad&&d.estado==="En revisión" && <button onClick={()=>accion("espera")} disabled={ocupado} className="rounded-lg border border-stone-300 px-3 py-1.5 text-xs font-semibold text-slate-700 hover:bg-stone-50">Poner en espera</button>}
            {esCalidad&&d.estado==="En espera" && <button onClick={()=>accion("reanudar")} disabled={ocupado} className="rounded-lg border border-stone-300 px-3 py-1.5 text-xs font-semibold text-slate-700 hover:bg-stone-50">Reanudar</button>}
            {esCalidad&&(d.estado==="En revisión"||d.estado==="En espera") && <button onClick={()=>accion("resolver")} disabled={ocupado||!txt.trim()} title="Escribe la resolución" className="rounded-lg border border-emerald-600 bg-emerald-600 px-3 py-1.5 text-xs font-bold text-white hover:brightness-95 disabled:opacity-40">Marcar resuelta</button>}
            {esSC&&d.estado==="Resuelta" && <button onClick={()=>accion("cerrar")} disabled={ocupado} className="rounded-lg border border-forza bg-forza px-3 py-1.5 text-xs font-bold text-forza-tinta hover:brightness-95">Cerrar incidencia</button>}
            {esSC&&d.estado==="Resuelta" && <button onClick={()=>accion("reabrir")} disabled={ocupado} className="rounded-lg border border-red-300 px-3 py-1.5 text-xs font-semibold text-red-700 hover:bg-red-50">Reabrir</button>}
          </div>
        </div>}
        {err && <p className="rounded-lg border border-l-[6px] border-red-500 bg-red-50 px-3 py-2 text-xs font-semibold text-red-700">{err}</p>}
      </div>}
    </div>
  </div>);
}

/* ---- Tablero + reporte ---- */
function Incidencias({incs,cargando,err,onRecargar,onNueva}){
  const [sel,setSel]=useState(null);const [vistaI,setVistaI]=useState("tablero");const [rep,setRep]=useState(null);const [repErr,setRepErr]=useState("");
  useEffect(()=>{if(vistaI==="reporte"&&!rep)incReporte().then(setRep).catch(e=>setRepErr(e.message));},[vistaI,rep]);
  const vencidas=(incs||[]).filter(i=>i.vencida).length;
  const abiertas=(incs||[]).filter(i=>i.estado!=="Cerrada"&&i.estado!=="Resuelta").length;
  function exportar(){
    const filas=(incs||[]).map(i=>({"Folio":i.folio,"Cliente":i.cliente,"Empresa":i.empresa,"Categoría":i.categoria,
      "Subcategorías":(i.subcategorias||[]).join(", "),"Estado":i.estado,"Días en gestión":i.dias,"Plazo":i.plazo_dias||"",
      "Vencida":i.vencida?"SI":"","Levantó":i.levanto_nombre||"","Atiende":i.atiende_nombre||"",
      "Creada":String(i.creada||"").slice(0,10),"Resuelta":String(i.resuelta||"").slice(0,10),"Cerrada":String(i.cerrada||"").slice(0,10),
      "Equipos":(i.equipos||[]).map(e=>e.tipo+(e.niv?" "+e.niv:"")).join(" ; "),"Descripción":i.descripcion,"Resolución":i.resolucion||""}));
    const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(filas),"Incidencias");
    XLSX.writeFile(wb,"incidencias_jjforza.xlsx");
  }
  return (<div>
    <div className="flex items-center justify-between gap-3 flex-wrap mb-4">
      <div className="flex flex-wrap gap-1 border-b-[3px] border-carbon">
        <Tab activo={vistaI==="tablero"} onClick={()=>setVistaI("tablero")}>Tablero</Tab>
        <Tab activo={vistaI==="reporte"} onClick={()=>{setRep(null);setVistaI("reporte");}}>Histórico</Tab>
      </div>
      <div className="flex items-center gap-2">
        <span className="text-xs font-semibold text-slate-500">{abiertas} abierta(s){vencidas>0?` · ${vencidas} vencida(s)`:""}</span>
        {onNueva && USR && (USR.nivel==="sc"||USR.nivel==="admin") && <button onClick={onNueva} className="inline-flex items-center gap-1 rounded-lg border border-forza bg-forza px-3 py-1.5 text-sm font-bold text-forza-tinta hover:brightness-95"><Icon name="plus" size={15}/> Nueva incidencia</button>}
        <button onClick={onRecargar} className="rounded-lg border border-stone-200 bg-white px-3 py-1.5 text-sm font-semibold text-slate-700 hover:border-slate-400">Recargar</button>
        <button onClick={exportar} className="inline-flex items-center gap-1.5 rounded-lg border border-carbon-edge bg-carbon px-3 py-1.5 text-sm font-semibold text-white hover:bg-carbon-2"><Icon name="download" size={15}/> Excel</button>
      </div>
    </div>
    {err && <div className="mb-4 rounded-lg border border-l-[6px] border-red-500 bg-red-50 px-4 py-3 text-sm font-medium text-red-700">{err}</div>}
    {cargando && <p className="text-sm text-slate-400">Cargando incidencias…</p>}
    {vistaI==="tablero" && !cargando && ((incs||[]).length===0
      ? <Vacio texto="Todavía no hay incidencias levantadas."/>
      : <div className="flex gap-3 overflow-x-auto pb-2">{INC_ESTADOS.map(est=>{const items=(incs||[]).filter(i=>i.estado===est);return (
        <div key={est} className="min-w-[240px] flex-1">
          <div className="flex items-center gap-2 mb-2 px-1"><span className={`h-2 w-2 rounded-full ${INC_COLOR[est].spine}`}></span>
            <h3 className="text-xs font-bold uppercase tracking-wide text-slate-600">{est}</h3><span className="ml-auto text-xs text-slate-400 mono">{items.length}</span></div>
          <div className="space-y-2">{items.map(i=>(
            <button key={i.id} onClick={()=>setSel(i.id)} className={`w-full rounded-lg border bg-white p-2.5 text-left hover:shadow-sm ${i.vencida?"border-red-300 ring-1 ring-red-200":"border-stone-200"}`}>
              <div className="flex items-center justify-between gap-2"><span className="mono text-xs font-bold text-carbon">{i.folio}</span>
                <span className={`mono text-[11px] font-bold ${i.vencida?"text-red-600":"text-slate-400"}`}>{i.dias}d</span></div>
              <p className="mt-0.5 text-sm font-semibold text-slate-900 truncate">{i.cliente}</p>
              <p className="text-[11px] text-slate-500">{i.empresa} · {i.categoria}</p>
              <p className="mt-1 text-xs text-slate-600 line-clamp-2" style={{display:"-webkit-box",WebkitLineClamp:2,WebkitBoxOrient:"vertical",overflow:"hidden"}}>{i.descripcion}</p>
              {(i.subcategorias||[]).length>0 && <div className="mt-1 flex flex-wrap gap-1">{i.subcategorias.map(sc=><span key={sc} className="rounded bg-stone-100 px-1.5 py-0.5 text-[10px] font-semibold text-slate-600">{sc}</span>)}</div>}
            </button>))}
            {items.length===0 && <div className="rounded-lg border border-dashed border-stone-300 py-6 text-center text-xs text-slate-400">—</div>}
          </div>
        </div>);})}</div>)}
    {vistaI==="reporte" && (repErr?<p className="text-sm text-red-600">{repErr}</p>:!rep?<p className="text-sm text-slate-400">Cargando histórico…</p>:
      <div className="space-y-5">
        <div className="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-5 gap-3">
          <Kpi icon="clip" label="Incidencias totales" valor={rep.total} tono="text-carbon"/>
          <Kpi icon="alarm" label="Abiertas" valor={rep.abiertas} tono="text-amber-600"/>
          <Kpi icon="alert" label="Vencidas" valor={rep.vencidas} tono="text-red-600"/>
          <Kpi icon="clock" label="Días prom. a resolver" valor={rep.dias_promedio_resolucion==null?"—":rep.dias_promedio_resolucion} tono="text-slate-900"/>
          <Kpi icon="check" label="Días prom. a cerrar" valor={rep.dias_promedio_cierre==null?"—":rep.dias_promedio_cierre} tono="text-emerald-600"/>
        </div>
        <div className="grid gap-4 md:grid-cols-3">
          {[["Por estado",rep.por_estado],["Por empresa",rep.por_empresa],["Por categoría",rep.por_categoria]].map(([t,o])=>(
            <div key={t} className="rounded-lg border border-stone-200 bg-white p-3">
              <h3 className="text-xs font-bold uppercase tracking-wide text-slate-500 mb-2">{t}</h3>
              {Object.keys(o||{}).length===0?<p className="text-xs text-slate-400">Sin datos.</p>:
              <ul className="space-y-1">{Object.entries(o).map(([k,v])=>(<li key={k} className="flex justify-between text-sm"><span className="text-slate-600">{k}</span><span className="mono font-bold">{v}</span></li>))}</ul>}
            </div>))}
        </div>
        <div className="rounded-lg border border-stone-200 bg-white p-3">
          <h3 className="text-xs font-bold uppercase tracking-wide text-slate-500 mb-2">Por mes</h3>
          {Object.keys(rep.por_mes||{}).length===0?<p className="text-xs text-slate-400">Sin datos.</p>:
          <ul className="space-y-1">{Object.entries(rep.por_mes).sort().map(([k,v])=>(<li key={k} className="flex justify-between text-sm"><span className="text-slate-600">{k}</span><span className="mono font-bold">{v}</span></li>))}</ul>}
        </div>
        <div className="rounded-lg border border-stone-200 bg-white p-3">
          <h3 className="text-xs font-bold uppercase tracking-wide text-slate-500 mb-2">Las que llevan más tiempo abiertas</h3>
          {(rep.mas_antiguas||[]).length===0?<p className="text-xs text-slate-400">Ninguna abierta.</p>:
          <div className="overflow-x-auto"><table className="w-full text-sm"><thead className="bg-stone-50 text-left text-xs uppercase text-slate-500"><tr><th className="px-3 py-2">Folio</th><th className="px-3 py-2">Cliente</th><th className="px-3 py-2">Empresa</th><th className="px-3 py-2">Estado</th><th className="px-3 py-2 text-right">Días</th></tr></thead>
          <tbody className="divide-y divide-stone-100">{rep.mas_antiguas.map(m=>(<tr key={m.folio}><td className="px-3 py-2 mono font-bold">{m.folio}</td><td className="px-3 py-2">{m.cliente}</td><td className="px-3 py-2">{m.empresa}</td><td className="px-3 py-2">{m.estado}</td><td className="px-3 py-2 text-right mono font-bold">{m.dias}</td></tr>))}</tbody></table></div>}
        </div>
      </div>)}
    {sel && <DetalleIncidencia id={sel} onClose={()=>setSel(null)} onCambio={onRecargar}/>}
  </div>);
}

/* ---- Pantalla completa para Calidad y monitoreo ---- */
function PantallaIncidencias({onSalir}){
  const [incs,setIncs]=useState([]);const [cargando,setCargando]=useState(true);const [err,setErr]=useState("");
  const cargar=React.useCallback(()=>{setCargando(true);setErr("");incListar().then(d=>{setIncs(d);setCargando(false);}).catch(e=>{setErr("No se pudieron cargar las incidencias: "+e.message);setCargando(false);});},[]);
  useEffect(()=>{cargar();},[cargar]);
  return (<div className="min-h-screen text-slate-800">
    <header className="border-b-[5px] border-forza bg-carbon">
      <div className="mx-auto max-w-6xl px-5 py-3.5 flex items-center justify-between gap-4">
        <h1 className="font-display text-white leading-none" style={{fontSize:"clamp(20px,3.2vw,32px)"}}>Incidencias de Calidad
          <small className="block mt-1 font-sans not-italic font-medium text-[13px]" style={{color:"#AEB3B9"}}>{USR?USR.nombre:""}{USR&&USR.nivel==="monitor"?" · solo consulta":""}</small></h1>
        <div className="marca-jj text-right shrink-0"><b>JJ FORZA</b><span>SEMI-REMOLQUES</span></div>
      </div>
    </header>
    <div className="border-b border-stone-200 bg-white"><div className="mx-auto max-w-6xl px-5 py-2.5 flex items-center gap-3">
      <span className="flex-1"></span>
      <button onClick={onSalir} className="rounded-full border border-stone-200 px-3 py-1 text-xs font-semibold text-slate-500 hover:border-slate-400">Salir</button>
    </div></div>
    <main className="mx-auto max-w-6xl px-5 py-5"><Incidencias incs={incs} cargando={cargando} err={err} onRecargar={cargar}/></main>
  </div>);
}

/* ---------- Piezas ---------- */
function Campo({label,children}){return <label className="block"><span className="mb-1 block text-xs font-semibold uppercase tracking-wide text-slate-500">{label}</span>{children}</label>;}
function Badges({r}){const es=(r.estatuses&&r.estatuses.length)?r.estatuses:[r.estatus];const ord=es.slice().sort((a,b)=>estIdx(a)-estIdx(b));return <div className="flex flex-wrap gap-1 justify-end max-w-[190px]">{ord.map(e=>{const c=ESTATUS_COLOR[e]||ESTATUS_COLOR[ESTATUS[0]];const p=e===r.estatus&&ord.length>1;return <span key={e} className={`inline-flex items-center rounded-full border px-2 py-0.5 text-[11px] font-medium whitespace-nowrap ${c.chip} ${p?"ring-1 ring-slate-400":""}`}>{e}</span>;})}</div>;}
function Badge({estatus}){const c=ESTATUS_COLOR[estatus]||ESTATUS_COLOR["Nueva"];return <span className={`inline-flex items-center rounded-full border px-2 py-0.5 text-xs font-medium whitespace-nowrap ${c.chip}`}>{estatus}</span>;}
function ContactoTag({contacto,compacto,inline}){const co=contacto==="Contestó";const cls=co?"text-emerald-600":"text-red-500";const dot=co?"bg-emerald-500":"bg-red-500";if(inline)return <span className={`font-semibold ${cls}`}>{contacto}</span>;return <span className={`inline-flex items-center gap-1 text-xs font-medium ${cls}`}><span className={`h-1.5 w-1.5 rounded-full ${dot}`}></span>{!compacto&&contacto}</span>;}
function TableroEtapas({counts,total,activo,onPick}){
  return (
    <div className="mb-5 rounded-xl border border-stone-200 bg-white p-3">
      <div className="flex items-center justify-between mb-2"><h3 className="text-xs font-bold uppercase tracking-wide text-slate-500">Clientes por etapa</h3><span className="text-xs text-slate-400">Total: <span className="mono font-bold text-slate-700">{total}</span></span></div>
      <div className="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-6 gap-2">
        {counts.map(({est,n})=>{const c=ESTATUS_COLOR[est];const on=activo===est;return (
          <button key={est} onClick={()=>onPick(est)} className={`rounded-lg border px-2.5 py-2 text-left transition-all ${on?"border-slate-400 ring-2 ring-slate-300 bg-stone-50":"border-stone-200 hover:bg-stone-50"} ${n===0?"opacity-45":""}`}>
            <div className="flex items-center gap-1.5"><span className={`h-2.5 w-2.5 rounded-full ${c.spine}`}></span><span className="text-lg font-bold mono text-slate-900 leading-none">{n}</span></div>
            <p className="mt-1 text-[11px] font-medium text-slate-500 leading-tight">{est}</p>
          </button>);})}
      </div>
    </div>
  );
}
function Kpi({icon,label,valor,tono}){return <div className="rounded-xl border border-stone-200 bg-white px-4 py-3"><div className="flex items-center gap-1.5 text-slate-400"><Icon name={icon} size={16}/><span className="text-xs font-medium text-slate-500">{label}</span></div><p className={`mt-1 text-2xl font-bold mono ${tono}`}>{valor}</p></div>;}
function Tab({activo,onClick,children}){return <button onClick={onClick} className={`rounded-t px-4 py-2.5 text-sm font-semibold ${activo?"bg-carbon text-white":"text-slate-500 hover:text-carbon"}`} aria-selected={activo}>{children}</button>;}
function Select({value,onChange,options,prefijo}){return <select value={value} onChange={e=>onChange(e.target.value)} className="rounded-lg border border-stone-300 bg-white px-2.5 py-1.5 text-sm text-slate-700 outline-none focus:border-slate-400 max-w-[180px]">{options.map(o=><option key={o} value={o}>{o==="Todos"?`${prefijo}: Todos`:o}</option>)}</select>;}
function Vacio({texto}){return <div className="rounded-xl border border-dashed border-stone-300 bg-white py-12 text-center"><Icon name="calendar" size={28} className="mx-auto text-stone-300"/><p className="mt-2 text-sm text-slate-500 max-w-xs mx-auto">{texto}</p></div>;}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
